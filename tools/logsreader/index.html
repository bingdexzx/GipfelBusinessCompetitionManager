<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务端日志分析 · logsreader</title>
    <style>
      :root {
        --bg: #eef1f6;
        --panel: #ffffff;
        --border: #e3e8ef;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: #eaf1ff;
        --error: #e5484d;
        --warn: #f5a623;
        --info: #4b83c1;
        --http: #8b5cf6;
        --verbose: #14b8a6;
        --debug: #94a3b8;
        --silly: #cbd5e1;
        --raw: #64748b;
        --code-bg: #0f172a;
        --code-fg: #e2e8f0;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.05);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --panel: #131c2e;
          --border: #243049;
          --text: #e5e9f0;
          --muted: #93a1b5;
          --accent-soft: #16233d;
          --code-bg: #060b16;
          --code-fg: #cdd6e4;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
      }
      header {
        background: linear-gradient(180deg, var(--panel), var(--panel));
        border-bottom: 1px solid var(--border);
        padding: 14px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.2px; }
      header .sub { color: var(--muted); font-size: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); flex: none; }
      .dot.off { background: var(--error); box-shadow: 0 0 0 3px rgba(229,72,77,.18); }
      .wrap { padding: 18px 22px 48px; display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .panel > h2 {
        font-size: 12px; margin: 0 0 14px; color: var(--muted); font-weight: 650;
        text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 8px;
      }
      .panel > h2::before { content: ""; width: 3px; height: 13px; background: var(--accent); border-radius: 2px; }

      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 18px; align-items: end; }
      .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .field > label { font-size: 12px; color: var(--muted); font-weight: 550; }
      select, input[type="text"], input[type="datetime-local"], input[type="number"] {
        border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
        background: var(--panel); color: var(--text); font-family: inherit; width: 100%;
        min-width: 0; /* 允许在 flex 子项中收缩，避免 datetime-local 等控件把网格格里内容撑出右侧边界 */
      }
      select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      .hint { font-size: 11px; color: var(--muted); font-weight: 400; }

      .levels { display: flex; flex-wrap: wrap; gap: 7px; }
      .lvl { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; user-select: none; font-size: 12px; transition: .12s; }
      .lvl input { display: none; }
      .lvl .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .lvl .cnt { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
      .lvl.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      .lvl:hover { border-color: var(--accent); }

      /* custom multi-select */
      .ms { position: relative; }
      .ms-control {
        width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
        border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
        background: var(--panel); color: var(--text); cursor: pointer; text-align: left; font-family: inherit;
      }
      .ms-control:hover { border-color: var(--accent); }
      .ms-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
      .ms-text.has { color: var(--text); }
      .ms-caret { color: var(--muted); font-size: 10px; flex: none; }
      .ms-pop {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: var(--shadow); padding: 8px; min-width: 220px;
      }
      .ms-search { width: 100%; margin-bottom: 6px; }
      .ms-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
      .ms-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
      .ms-opt:hover { background: var(--accent-soft); }
      .ms-opt.on { background: var(--accent-soft); color: var(--accent); }
      .ms-empty { padding: 10px; color: var(--muted); text-align: center; font-size: 12px; }
      .ms-foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; text-align: right; }
      .ms-foot button { font-size: 12px; padding: 4px 10px; }

      .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .preset { font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; color: var(--muted); }
      .preset:hover { border-color: var(--accent); color: var(--accent); }

      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
      button {
        border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px;
        padding: 8px 15px; font-size: 13px; cursor: pointer; font-family: inherit; transition: .12s;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.primary:hover { filter: brightness(1.06); }
      button.follow.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      .status { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
      .live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
      .live.on { display: inline-block; animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

      .stats-grid { display: grid; grid-template-columns: 220px 1fr; gap: 22px; }
      .lvl-counts { display: flex; flex-direction: column; gap: 7px; }
      .lc-row { display: flex; align-items: center; gap: 9px; }
      .lc-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
      .lc-row .name { width: 60px; color: var(--muted); }
      .lc-row .val { font-variant-numeric: tabular-nums; font-weight: 650; }
      .lc-bar { flex: 1; height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; }
      .lc-bar > i { display: block; height: 100%; border-radius: 4px; }
      .bars { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
      .bar-row { display: grid; grid-template-columns: 170px 1fr 54px; gap: 9px; align-items: center; }
      .bar-row .bl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
      .bar-track { background: var(--bg); border-radius: 5px; height: 18px; overflow: hidden; }
      .bar-fill { background: var(--accent); height: 100%; border-radius: 5px; transition: width .2s; }
      .bar-row .bv { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

      .tl-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
      .tl-leg { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
      .tl-leg .sw { width: 9px; height: 9px; border-radius: 2px; }
      .timeline { width: 100%; overflow-x: auto; }
      .timeline svg { display: block; }

      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      thead th { text-align: left; padding: 9px 11px; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
      th.col-ts { width: 150px; } th.col-lv { width: 72px; } th.col-ctx { width: 150px; } th.col-op { width: 120px; } th.col-rid { width: 100px; } th.col-url { width: 220px; } th.col-sz { width: 132px; }
      tbody td.sz { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12px; }
      tbody td.url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; color: var(--accent); }
      .sz .up { color: #e5484d; }
      .sz .down { color: #4b83c1; }
      .sz .muted { color: var(--muted); }
      tbody td { padding: 7px 11px; border-bottom: 1px solid var(--border); vertical-align: top; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: var(--accent-soft); }
      tbody tr.expanded { background: var(--accent-soft); }
      .badge { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 11px; font-weight: 650; color: #fff; }
      .msg { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 54px; overflow: hidden; }
      tr.expanded .msg { max-height: none; }
      .ctx { color: var(--muted); white-space: nowrap; }
      .op { color: #7c3aed; white-space: nowrap; font-size: 12px; }
      .ts { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .file-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
      tbody tr.row-err { background: rgba(229,72,77,0.09); box-shadow: inset 3px 0 0 var(--error); }
      tbody tr.row-err:hover { background: rgba(229,72,77,0.15); }
      tbody tr.row-warn { background: rgba(245,166,35,0.08); box-shadow: inset 3px 0 0 var(--warn); }
      tbody tr.row-warn:hover { background: rgba(245,166,35,0.13); }
      tbody tr.row-slow { background: rgba(139,92,246,0.08); box-shadow: inset 3px 0 0 var(--http); }
      tbody tr.row-slow:hover { background: rgba(139,92,246,0.13); }
      .rid { color: var(--muted); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; white-space: nowrap; cursor: pointer; }
      .rid:hover { color: var(--accent); text-decoration: underline; }
      .detail td { background: var(--code-bg); padding: 0; }
      .detail .dh { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--code-bg); border-bottom: 1px solid #1e293b; }
      .detail .dh button { font-size: 11px; padding: 3px 10px; background: #1e293b; color: var(--code-fg); border-color: #334155; }
      .detail pre { margin: 0; padding: 12px; color: var(--code-fg); white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; max-height: 380px; overflow: auto; }
      .j-key { color: #7dd3fc; } .j-str { color: #86efac; } .j-num { color: #fca5a5; } .j-bool { color: #c4b5fd; } .j-null { color: #94a3b8; }
      .empty { color: var(--muted); padding: 34px; text-align: center; }
      .load-more { text-align: center; color: var(--muted); font-size: 12px; padding: 14px; }
      .tl-head { display: flex; justify-content: space-between; align-items: center; }
      .export-btn { font-size: 12px; padding: 5px 12px; }
      /* 快捷栏 + 分段级别控件 */
      .quickbar { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
      .quickbar .field { min-width: 0; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: 100%; }
      .seg .preset { border: none; border-radius: 0; border-right: 1px solid var(--border); padding: 8px 14px; color: var(--muted); font-size: 13px; flex: 1; text-align: center; }
      .seg .preset:last-child { border-right: none; }
      .seg .preset:hover { color: var(--accent); background: var(--accent-soft); }
      .seg .preset.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .seg .preset[data-lv="err"].active { background: var(--error); border-color: var(--error); }
      .seg .preset[data-lv="erraw"].active { background: var(--warn); border-color: var(--warn); color: #1f2937; }
      .adv-toggle { margin-top: 14px; background: none; border: none; color: var(--accent); font-size: 12.5px; padding: 0; cursor: pointer; font-family: inherit; }
      .adv-toggle:hover { text-decoration: underline; }
      .adv { margin-top: 14px; }
      .adv.collapsed { display: none; }
      .hint-err { color: var(--error); font-weight: 600; }
      @media (max-width: 760px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <span class="dot off" id="connDot"></span>
      <h1>服务端日志分析</h1>
      <span class="sub" id="logsDir"></span>
    </header>

    <div class="wrap">
      <div class="panel">
        <h2>筛选条件</h2>
        <div class="quickbar">
          <div class="field" style="flex: 1 1 190px;">
            <label>日期 <span class="hint">合并日志 + 错误</span></label>
            <select id="fileSel"><option value="">（加载中…）</option></select>
          </div>
          <div class="field" style="flex: 1 1 240px;">
            <label>级别</label>
            <div class="seg">
              <button type="button" class="preset active" data-lv="all">全部</button>
              <button type="button" class="preset" data-lv="err">仅错误</button>
              <button type="button" class="preset" data-lv="erraw">错误+警告</button>
            </div>
          </div>
          <div class="field" style="flex: 2 1 260px;">
            <label>关键词</label>
            <input type="text" id="q" placeholder="搜索消息 / JSON 内容…" />
          </div>
          <div class="field" style="flex: 0 0 auto; justify-content: flex-end;">
            <label>&nbsp;</label>
            <div class="actions" style="margin-top: 0;">
              <button class="primary" id="runBtn">查询</button>
              <button id="resetBtn">重置</button>
            </div>
          </div>
        </div>

        <button type="button" class="adv-toggle" id="advToggle">高级筛选 ▾</button>
        <div class="adv collapsed" id="adv">
          <div class="filters">
            <div class="field">
              <label>级别（自定义组合）</label>
              <div class="levels" id="levels"></div>
            </div>
            <div class="field">
              <label>上下文 context</label>
              <div id="ctxWrap"></div>
            </div>
            <div class="field">
              <label>操作员 operator</label>
              <div id="opWrap"></div>
            </div>
            <div class="field">
              <label>请求编号 requestId</label>
              <input type="text" id="ridFilter" placeholder="按 requestId 过滤…" />
            </div>
            <div class="field">
              <label>时间范围</label>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <input type="datetime-local" id="from" step="1" placeholder="起始" />
                <input type="datetime-local" id="to" step="1" placeholder="结束" />
              </div>
              <div class="presets">
                <span class="preset" data-p="today">今天</span>
                <span class="preset" data-p="1h">近 1 小时</span>
                <span class="preset" data-p="24h">近 24 小时</span>
                <span class="preset" data-p="all">全部</span>
              </div>
            </div>
            <div class="field">
              <label>排序 / 分页上限 <span class="hint">空 = 全加载</span></label>
              <div style="display: flex; gap: 6px; min-width: 0;">
                <select id="order" style="flex: 1; min-width: 0;">
                  <option value="desc">最新在前</option>
                  <option value="asc">最早在前</option>
                </select>
                <input type="number" id="limit" placeholder="不限" min="1" style="width: 84px; min-width: 0;" />
              </div>
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top: 16px;">
          <button class="follow" id="followBtn">实时跟随</button>
          <span class="status" id="status"><span class="live" id="liveDot"></span><span id="statusText"></span></span>
        </div>
      </div>

      <div class="panel">
        <h2>统计</h2>
        <div class="stats-grid">
          <div class="lvl-counts" id="lvlCounts"></div>
          <div>
            <div style="font-size: 12px; color: var(--muted); margin-bottom: 7px;">上下文 Top（按出现次数）</div>
            <div class="bars" id="ctxBars"></div>
          </div>
        </div>
        <div class="pkt-stats" id="pktStats" style="margin-top: 14px;"></div>
        <div id="urlStats" style="margin-top: 16px;"></div>
        <div style="margin-top: 18px;">
          <div class="tl-head">
            <div style="font-size: 12px; color: var(--muted);">时间线（堆叠：各级别数量）</div>
            <div class="tl-legend" id="tlLegend"></div>
          </div>
          <div class="timeline" id="timeline" style="margin-top: 8px;"></div>
        </div>
      </div>

      <div class="panel">
        <div class="tl-head" style="margin-bottom: 12px;">
          <h2 style="margin: 0;">日志明细 <span class="hint" id="rowCount"></span></h2>
          <button class="export-btn" id="exportBtn">导出 CSV</button>
        </div>
        <table id="logTable">
          <thead>
            <tr>
              <th class="col-ts">时间</th>
              <th class="col-lv">级别</th>
              <th class="col-ctx">上下文</th>
              <th class="col-op">操作员</th>
              <th class="col-rid">请求ID</th>
              <th class="col-url">URL</th>
              <th>消息</th>
              <th class="col-sz">包大小</th>
            </tr>
          </thead>
          <tbody id="logBody">
            <tr><td colspan="6" class="empty">点击「查询」加载日志</td></tr>
          </tbody>
        </table>
        <div id="loadMore" class="load-more">下拉到底部自动加载更多…</div>
      </div>
    </div>

    <script>
      const LEVEL_COLORS = {
        error: "#e5484d", warn: "#f5a623", info: "#4b83c1", http: "#8b5cf6",
        verbose: "#14b8a6", debug: "#94a3b8", silly: "#cbd5e1", raw: "#64748b",
      };
      const LEVELS = ["error", "warn", "info", "http", "verbose", "debug", "silly"];

      const $ = (id) => document.getElementById(id);
      let currentRows = [];
      let followTimer = null;
      let lastEndOffset = 0;
      let levelChips = {};
      const DAY_FILES = {}; // date -> [file names]

      // 分页 / 无限滚动状态
      const PAGE_SIZE = 200;        // 每页条数
      let pageOffset = 0;           // 已请求的下一页起始（= 已加载行数，作为 offset 传给后端）
      let total = 0;                // 本次查询匹配总数
      let loadingMore = false;      // 是否正在加载下一页（防并发）
      let allLoaded = false;        // 是否已加载完全部匹配行
      let following = false;        // 实时跟随中（暂停分页懒加载）
      let sentinelObs = null;

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function fmtNum(n) { return (n == null ? 0 : n).toLocaleString("en-US"); }
      function fmtBytes(n) {
        if (n == null || isNaN(n) || n <= 0) return "-";
        if (n < 1024) return n + " B";
        const units = ["KB", "MB", "GB", "TB"];
        let v = n / 1024, i = 0;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + " " + units[i];
      }
      function dtToServer(v) { return v ? v.replace("T", " ") + ":00" : null; }
      function pad(n) { return String(n).padStart(2, "0"); }
      function toLocalInput(d) {
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      function syntaxHighlight(json) {
        json = escapeHtml(json);
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (m) => {
          let cls = "j-num";
          if (/^"/.test(m)) cls = /:$/.test(m) ? "j-key" : "j-str";
          else if (/true|false/.test(m)) cls = "j-bool";
          else if (/null/.test(m)) cls = "j-null";
          return `<span class="${cls}">${m}</span>`;
        });
      }

      async function api(path, body) {
        const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
        return r.json();
      }

      /* ---- custom multi-select ---- */
      function MultiSelect(placeholder) {
        const el = document.createElement("div");
        el.className = "ms";
        el.innerHTML = `
          <button type="button" class="ms-control"><span class="ms-text">${placeholder}</span><span class="ms-caret">▾</span></button>
          <div class="ms-pop" hidden>
            <input class="ms-search" placeholder="搜索过滤…" />
            <div class="ms-list"></div>
            <div class="ms-foot"><button type="button" class="ms-clear">清空选择</button></div>
          </div>`;
        const control = el.querySelector(".ms-control");
        const pop = el.querySelector(".ms-pop");
        const list = el.querySelector(".ms-list");
        const search = el.querySelector(".ms-search");
        const text = el.querySelector(".ms-text");
        const selected = new Set();
        let options = [];

        function updateText() {
          if (!selected.size) { text.textContent = placeholder; text.classList.remove("has"); }
          else if (selected.size <= 2) { text.textContent = [...selected].join(", "); text.classList.add("has"); }
          else { text.textContent = `已选 ${selected.size} 项`; text.classList.add("has"); }
        }
        function render() {
          const q = search.value.trim().toLowerCase();
          const filtered = options.filter((o) => !q || o.toLowerCase().includes(q));
          list.innerHTML = filtered.length ? "" : '<div class="ms-empty">无匹配</div>';
          for (const o of filtered) {
            const on = selected.has(o);
            const row = document.createElement("label");
            row.className = "ms-opt" + (on ? " on" : "");
            row.innerHTML = `<input type="checkbox" ${on ? "checked" : ""}/><span>${escapeHtml(o)}</span>`;
            row.querySelector("input").addEventListener("change", (e) => {
              if (e.target.checked) selected.add(o); else selected.delete(o);
              row.classList.toggle("on", e.target.checked);
              updateText();
            });
            list.appendChild(row);
          }
          updateText();
        }
        control.addEventListener("click", (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; if (!pop.hidden) { render(); search.focus(); } });
        pop.addEventListener("click", (e) => e.stopPropagation());
        search.addEventListener("click", (e) => e.stopPropagation());
        document.addEventListener("click", () => { pop.hidden = true; });
        search.addEventListener("input", render);
        el.querySelector(".ms-clear").addEventListener("click", (e) => { e.stopPropagation(); selected.clear(); render(); });

        return {
          el,
          setOptions(arr) {
            options = [...arr];
            for (const s of [...selected]) if (!options.includes(s)) selected.delete(s);
            render();
          },
          getValues() { return [...selected]; },
          clear() { selected.clear(); render(); },
        };
      }
      const ctxMS = MultiSelect("全部上下文");
      const opMS = MultiSelect("全部操作员");
      $("ctxWrap").appendChild(ctxMS.el);
      $("opWrap").appendChild(opMS.el);

      async function loadList() {
        try {
          const data = await api("/api/list");
          $("logsDir").textContent = "日志目录: " + data.logsDir;
          $("connDot").classList.remove("off");
          const sel = $("fileSel");
          sel.innerHTML = "";
          if (!data.files.length) { sel.innerHTML = '<option value="">（无日志文件）</option>'; return; }
          // 按日期分组：每天合并 app- + error- 两个文件，供「一天的日志和错误放在一起」查看
          for (const f of data.files) {
            if (!DAY_FILES[f.date]) DAY_FILES[f.date] = [];
            DAY_FILES[f.date].push(f.name);
          }
          const allFiles = data.files.map((f) => f.name);
          const oAll = document.createElement("option");
          oAll.value = "__all__";
          oAll.textContent = "全部日期（跨天搜索）";
          sel.appendChild(oAll);
          // data.files 已按日期倒序，去重得到日期列表
          const dates = [];
          for (const f of data.files) if (!dates.includes(f.date)) dates.push(f.date);
          for (const d of dates) {
            const kinds = DAY_FILES[d].map((n) => (n.startsWith("error") ? "错误" : "日志")).join(" + ");
            const o = document.createElement("option");
            o.value = d;
            o.textContent = `${d}  (${kinds})`;
            sel.appendChild(o);
          }
          sel.value = dates[0] || "__all__";
        } catch (e) {
          $("connDot").classList.add("off");
          $("logsDir").textContent = "无法连接服务: " + e.message;
        }
      }

      function renderLevels(active) {
        const box = $("levels");
        box.innerHTML = "";
        levelChips = {};
        const set = new Set(active.length ? active : LEVELS);
        for (const lv of LEVELS) {
          const el = document.createElement("label");
          el.className = "lvl" + (set.has(lv) ? " active" : "");
          el.innerHTML = `<input type="checkbox" value="${lv}" ${set.has(lv) ? "checked" : ""}/><span class="sw" style="background:${LEVEL_COLORS[lv] || "#94a3b8"}"></span><span class="lab">${lv}</span><span class="cnt"></span>`;
          el.querySelector("input").addEventListener("change", (e) => { el.classList.toggle("active", e.target.checked); syncSeg(); });
          box.appendChild(el);
          levelChips[lv] = { el, cnt: el.querySelector(".cnt") };
        }
      }
      function updateLevelCounts(byLevel) {
        for (const lv in levelChips) {
          const c = byLevel && byLevel[lv];
          levelChips[lv].cnt.textContent = c ? fmtNum(c) : "";
        }
      }

      function buildPayload() {
        const levels = [...document.querySelectorAll("#levels .lvl.active input")].map((i) => i.value);
        const day = $("fileSel").value;
        // 选某天 -> 合并该天 app- + error- 文件；选「全部日期」-> 空数组（服务端视为全部文件）
        const files = day === "__all__" ? [] : (DAY_FILES[day] || []);
        return {
          files,
          levels, contexts: ctxMS.getValues(), operators: opMS.getValues(),
          q: $("q").value.trim(),
          rid: $("ridFilter").value.trim(),
          from: dtToServer($("from").value),
          to: dtToServer($("to").value),
          order: $("order").value,
          // 分页：固定每页 PAGE_SIZE 条；offset 由前端分页状态控制（loadMore 会覆盖写入）。
          // 高级「分页上限」输入框仅作为客户端累计加载上限（见 doQuery / loadMore），不参与后端切片。
          limit: PAGE_SIZE,
        };
      }

      function renderStats(data) {
        const lc = $("lvlCounts");
        lc.innerHTML = "";
        const bl = data.byLevel || {};
        const order = Object.keys(bl).sort((a, b) => LEVELS.indexOf(a) - LEVELS.indexOf(b));
        const max = order.reduce((m, l) => Math.max(m, bl[l]), 1);
        for (const lv of order) {
          const row = document.createElement("div");
          row.className = "lc-row";
          const pct = Math.max(3, (bl[lv] / max) * 100);
          row.innerHTML = `<span class="sw" style="background:${LEVEL_COLORS[lv] || "#94a3b8"}"></span><span class="name">${lv}</span><span class="val">${fmtNum(bl[lv])}</span><span class="lc-bar"><i style="width:${pct}%;background:${LEVEL_COLORS[lv] || "#94a3b8"}"></i></span>`;
          lc.appendChild(row);
        }
        const cb = $("ctxBars");
        cb.innerHTML = "";
        const cc = data.byContext || [];
        const mx = cc.length ? cc[0].count : 1;
        for (const c of cc) {
          const pct = Math.max(2, (c.count / mx) * 100);
          const row = document.createElement("div");
          row.className = "bar-row";
          row.innerHTML = `<span class="bl" title="${escapeHtml(c.context)}">${escapeHtml(c.context)}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bv">${fmtNum(c.count)}</span>`;
          cb.appendChild(row);
        }
        if (!cc.length) cb.innerHTML = '<span class="empty">无数据</span>';
        renderTimeline(data.timeline || []);
        updateLevelCounts(bl);

        // 数据包大小合计：后端基于 matched 全集合计好，随首屏响应一同返回，上来即为完整总计（与分页无关）
        const pk = $("pktStats");
        const pkt = data.pktTotals || { up: 0, down: 0, cnt: 0 };
        pk.innerHTML = `<span style="font-size:12px;color:var(--muted);">数据包大小合计：</span>`
          + `<span class="up" style="color:#e5484d;font-weight:600;">↑ 上行 ${fmtBytes(pkt.up)}</span>`
          + `<span style="margin:0 8px;color:var(--border);">|</span>`
          + `<span class="down" style="color:#4b83c1;font-weight:600;">↓ 下行 ${fmtBytes(pkt.down)}</span>`
          + `<span style="font-size:12px;color:var(--muted);margin-left:10px;">（含包大小记录 ${fmtNum(pkt.cnt)} 条）</span>`
          + (data.slowCount > 0 ? `<span style="margin-left:16px;color:#8b5cf6;font-weight:600;">⚠ 慢请求 ${fmtNum(data.slowCount)} 条</span>` : "");

        // URL 路径 Top 统计：后端按「路径（已去除 ?query 参数）」聚合，反映各 API 端点访问次数
        const ub = $("urlStats");
        const uu = data.byUrl || [];
        if (uu.length) {
          ub.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:7px;">URL 路径 Top（按访问次数，已去除参数）</div><div class="bars" id="urlBars"></div>';
          const uBars = $("urlBars");
          const mxu = uu[0].count;
          for (const u of uu) {
            const pct = Math.max(2, (u.count / mxu) * 100);
            const row = document.createElement("div");
            row.className = "bar-row";
            row.innerHTML = `<span class="bl" title="${escapeHtml(u.url)}">${escapeHtml(u.url)}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bv">${fmtNum(u.count)}</span>`;
            uBars.appendChild(row);
          }
        } else {
          ub.innerHTML = '<span class="empty">无数据</span>';
        }
      }

      function renderTimeline(timeline) {
        const box = $("timeline");
        const legend = $("tlLegend");
        legend.innerHTML = "";
        const present = new Set();
        timeline.forEach((t) => LEVELS.forEach((l) => { if (t[l]) present.add(l); }));
        for (const l of LEVELS) {
          if (!present.has(l)) continue;
          const s = document.createElement("span");
          s.className = "tl-leg";
          s.innerHTML = `<span class="sw" style="background:${LEVEL_COLORS[l]}"></span>${l}`;
          legend.appendChild(s);
        }
        if (!timeline.length) { box.innerHTML = '<span class="empty">无数据</span>'; return; }
        const W = Math.max(680, timeline.length * 18);
        const H = 180, padB = 24, padT = 10, plotH = H - padB - padT;
        const colW = W / timeline.length;
        const maxTotal = Math.max(1, ...timeline.map((t) => LEVELS.reduce((s, l) => s + (t[l] || 0), 0)));
        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:${W}px">`;
        for (let g = 0; g <= 4; g++) {
          const y = padT + (plotH * g) / 4;
          const val = Math.round((maxTotal * (4 - g)) / 4);
          svg += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" style="stroke:var(--border)" stroke-width="1"/>`;
          svg += `<text x="3" y="${y - 3}" font-size="9" style="fill:var(--muted)">${fmtNum(val)}</text>`;
        }
        timeline.forEach((t, i) => {
          let y = padT; const x = i * colW;
          let tip = `时间: ${t.bucket}`;
          for (const lv of [...LEVELS].reverse()) {
            const cnt = t[lv] || 0; if (!cnt) continue;
            const h = (cnt / maxTotal) * plotH;
            svg += `<rect x="${x + 1}" y="${y.toFixed(1)}" width="${Math.max(0, colW - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${LEVEL_COLORS[lv]}"/>`;
            y += h; tip += `  ${lv}: ${cnt}`;
          }
          svg += `<g><title>${escapeHtml(tip)}</title><rect x="${x}" y="${padT}" width="${colW}" height="${plotH}" fill="transparent"/></g>`;
          if (i === 0 || i === timeline.length - 1 || i === Math.floor(timeline.length / 2)) {
            svg += `<text x="${x + colW / 2}" y="${H - 7}" font-size="9" style="fill:var(--muted)" text-anchor="middle">${escapeHtml(t.bucket)}</text>`;
          }
        });
        svg += `</svg>`;
        box.innerHTML = svg;
      }

      let renderToken = 0;
      function buildRowEl(row) {
        const tr = document.createElement("tr");
        tr._obj = row; // 直接把记录挂在元素上，详情展开按引用取，避免分页增删导致索引错位
        // 行样式：error > warn > 慢请求（warn + 慢请求消息）
        if (row.level === "error") tr.className = "row-err";
        else if (row.level === "warn" && row.message && row.message.includes("慢请求")) tr.className = "row-slow";
        else if (row.level === "warn") tr.className = "row-warn";
        const color = LEVEL_COLORS[row.level] || "#94a3b8";
        const hasSz = (row.requestBodySize || row.responseBodySize);
        const szHtml = hasSz
          ? `<span class="up">↑${fmtBytes(row.requestBodySize)}</span> <span class="down">↓${fmtBytes(row.responseBodySize)}</span>`
          : '<span class="muted">-</span>';
        const rid = row.requestId || "";
        const ridHtml = rid ? `<span class="rid" title="点击过滤此请求ID">${escapeHtml(rid.substring(0, 8))}</span>` : "";
        tr.innerHTML = `
          <td class="ts">${escapeHtml(row.timestamp || "")}</td>
          <td><span class="badge" style="background:${color}">${escapeHtml(row.level || "")}</span></td>
          <td class="ctx">${escapeHtml(row.context || "")}</td>
          <td class="op">${escapeHtml(row.operator || "")}</td>
          <td class="rid-cell">${ridHtml}</td>
          <td class="url" title="${escapeHtml(row.url || "")}">${escapeHtml(row.url || "")}</td>
          <td class="msg">${escapeHtml(row.message || "")}<span class="file-tag">${escapeHtml(row.file || "")}</span></td>
          <td class="sz">${szHtml}</td>`;
        tr.addEventListener("click", () => toggleDetail(tr));
        // requestId 点击过滤
        const ridEl = tr.querySelector(".rid");
        if (ridEl && rid) {
          ridEl.addEventListener("click", (e) => {
            e.stopPropagation();
            $("ridFilter").value = rid;
            stopFollow();
            doQuery(false);
          });
        }
        return tr;
      }
      // 分批把 rows 追加进表格并按当前 token 防旧批次串台。
      function appendRowsToBody(rows, tokenCheck) {
        const body = $("logBody");
        let i = 0;
        const BATCH = 600;
        function step() {
          if (tokenCheck != null && tokenCheck !== renderToken) return; // 已被新查询取代
          const end = Math.min(i + BATCH, rows.length);
          for (; i < end; i++) {
            const tr = buildRowEl(rows[i]);
            body.appendChild(tr);
            currentRows.push(rows[i]);
          }
          if (i < rows.length) requestAnimationFrame(step);
        }
        step();
      }
      // mode: 'replace' 清空表格并渲染首页；'append' 追加到末尾（分页懒加载）
      function renderRows(rows, mode) {
        const body = $("logBody");
        if (mode === "replace") {
          ++renderToken;
          body.innerHTML = "";
          currentRows = [];
          if (!rows.length) { body.innerHTML = '<tr><td colspan="7" class="empty">没有匹配的日志</td></tr>'; return; }
        }
        appendRowsToBody(rows, renderToken);
      }
      // 实时跟随：把新行插入到表格最顶部（最新在前）。保持 currentRows 与 matched 顶部一致，
      // 以便停止跟随后分页能从 pageOffset 无缝续接（不会重复）。
      function prependRows(rows) {
        const body = $("logBody");
        const empty = body.querySelector(".empty");
        if (empty) empty.remove();
        // 倒序插入，使 rows[0]（最新）落在最上
        for (let k = rows.length - 1; k >= 0; k--) {
          const tr = buildRowEl(rows[k]);
          body.insertBefore(tr, body.firstChild);
          currentRows.unshift(rows[k]);
        }
      }

      function toggleDetail(tr) {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains("detail")) { next.remove(); tr.classList.remove("expanded"); return; }
        const obj = tr._obj;
        const detail = document.createElement("tr");
        detail.className = "detail";
        const td = document.createElement("td");
        td.colSpan = 7;
        td.innerHTML = `<div class="dh"><span style="color:var(--code-fg);font-size:11px;">完整记录 (${escapeHtml(obj.file || "")})</span><button type="button" id="copyBtn">复制 JSON</button></div><pre>${syntaxHighlight(JSON.stringify(obj, null, 2))}</pre>`;
        detail.appendChild(td);
        tr.classList.add("expanded");
        tr.parentNode.insertBefore(detail, tr.nextSibling);
        td.querySelector("#copyBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => {
            const b = e.target; b.textContent = "已复制"; setTimeout(() => (b.textContent = "复制 JSON"), 1200);
          });
        });
      }

      function fillFacets(facets) {
        if (facets && facets.levels) renderLevels(facets.levels);
        if (facets && facets.contexts) ctxMS.setOptions(facets.contexts);
        if (facets && facets.operators) opMS.setOptions(facets.operators);
      }

      // 加载下一页（分页懒加载）：在已加载基础上 offset += 已加载行数，追加而不是覆盖。
      async function loadMore() {
        if (loadingMore || allLoaded || following) return;
        if (pageOffset >= total) { allLoaded = true; updateLoadMore(); return; }
        loadingMore = true;
        setLoadMore("加载中…");
        const t0 = performance.now();
        const payload = buildPayload();
        payload.offset = pageOffset; // 从已加载位置继续取下一页
        payload.limit = PAGE_SIZE;
        try {
          const data = await api("/api/query", payload);
          if (!data.ok) { setLoadMore("加载失败: " + data.error); return; }
          lastEndOffset = data.endOffset || lastEndOffset;
          renderStats(data); // 统计/时间线/facets/数据包合计均为全量计算，幂等刷新
          renderRows(data.rows, "append");
          pageOffset += data.rows.length;
          // 客户端分页上限（高级「分页上限」）：达到上限即停止继续懒加载
          const cap = Number($("limit").value) || 0;
          allLoaded = pageOffset >= total || (cap && pageOffset >= cap);
          $("rowCount").textContent = `已加载 ${fmtNum(pageOffset)} / 共 ${fmtNum(total)} 条`;
          updateLoadMore();
        } catch (e) {
          setLoadMore("加载失败: " + e.message);
        } finally {
          loadingMore = false;
        }
      }
      function setLoadMore(text) { const el = $("loadMore"); if (el) el.textContent = text; }
      function updateLoadMore() {
        if (following) { setLoadMore("实时跟随中…"); return; }
        if (allLoaded) setLoadMore(`—— 已加载全部 ${fmtNum(total)} 条 ——`);
        else setLoadMore("下拉到底部自动加载更多…");
      }

      async function doQuery(isFollow) {
        const t0 = performance.now();
        const payload = buildPayload();
        if (isFollow) { payload.follow = true; payload.afterOffset = lastEndOffset; payload.offset = 0; }
        try {
          const data = await api("/api/query", payload);
          if (!data.ok) { $("statusText").textContent = "错误: " + data.error; return; }
          lastEndOffset = data.endOffset || 0;
          fillFacets(data.facets);
          syncSeg();
          if (isFollow) {
            // 实时跟随：新行插入顶部（最新在前），currentRows 仍为 matched 顶部，停止后可无缝续接分页
            following = true;
            renderStats(data);
            prependRows(data.rows);
            const cap = Number($("limit").value) || 0;
            if (cap && currentRows.length > cap) {
              // 超出上限时从底部（最旧）裁剪，保持 currentRows = matched 的顶部 cap 行
              while (currentRows.length > cap) {
                currentRows.pop();
                const last = $("logBody").lastElementChild;
                if (last && !last.classList.contains("detail")) last.remove();
              }
            }
            total = data.total;
            const ms = Math.round(performance.now() - t0);
            $("rowCount").textContent = `已加载 ${fmtNum(currentRows.length)} / 共 ${fmtNum(total)} 条`;
            $("statusText").textContent = `实时跟随中 · 新增 ${data.count} 条 · 已匹配 ${fmtNum(total)} · 已加载 ${fmtNum(currentRows.length)} · ${ms}ms`;
          } else {
            // 新查询：重置分页状态，仅加载首页（PAGE_SIZE 条）
            following = false;
            pageOffset = data.rows.length;
            total = data.total;
            const cap = Number($("limit").value) || 0;
            allLoaded = pageOffset >= total || (cap && pageOffset >= cap);
            renderStats(data);
            renderRows(data.rows, "replace");
            const ms = Math.round(performance.now() - t0);
            $("rowCount").textContent = `已加载 ${fmtNum(pageOffset)} / 共 ${fmtNum(total)} 条`;
            let msg = `已匹配 ${fmtNum(total)} 条 · ${ms}ms`;
            if (allLoaded) msg = `共 ${fmtNum(total)} 条 · 已全部加载 · ${ms}ms`;
            else msg += `（下拉自动加载更多）`;
            $("statusText").textContent = msg;
            updateLoadMore();
          }
        } catch (e) {
          $("statusText").textContent = "查询失败: " + e.message;
        }
      }

      function stopFollow() {
        if (followTimer) { clearInterval(followTimer); followTimer = null; }
        $("followBtn").classList.remove("on");
        $("followBtn").textContent = "实时跟随";
        $("liveDot").classList.remove("on");
        // 停止跟随后，已加载的 currentRows 即为 matched 顶部若干行，分页从当前位置无缝续接
        following = false;
        pageOffset = currentRows.length;
        allLoaded = pageOffset >= total;
        updateLoadMore();
      }

      function setPreset(p) {
        const now = new Date();
        if (p === "all") { $("from").value = ""; $("to").value = ""; return; }
        if (p === "today") { $("from").value = toLocalInput(new Date(now.getFullYear(), now.getMonth(), now.getDate())); }
        if (p === "1h") { $("from").value = toLocalInput(new Date(now.getTime() - 3600e3)); }
        if (p === "24h") { $("from").value = toLocalInput(new Date(now.getTime() - 24 * 3600e3)); }
        $("to").value = toLocalInput(now);
      }

      // 级别快捷筛选：快速把错误（/警告）单独挑出来查看，无需在大量 info 中翻找。
      function applyLevelPreset(mode) {
        const want = mode === "all" ? LEVELS : mode === "err" ? ["error"] : ["error", "warn"];
        document.querySelectorAll("#levels .lvl").forEach((el) => {
          const inp = el.querySelector("input");
          const on = want.includes(inp.value);
          inp.checked = on;
          el.classList.toggle("active", on);
        });
        syncSeg();
      }
      // 让顶部分段控件（全部/仅错误/错误+警告）反映当前 chips 的真实选择
      function syncSeg() {
        const set = new Set([...document.querySelectorAll("#levels .lvl.active input")].map((i) => i.value));
        const allOn = LEVELS.every((l) => set.has(l));
        const onlyErr = set.has("error") && set.size === 1;
        const errWarn = set.has("error") && set.has("warn") && set.size === 2;
        const mode = allOn ? "all" : onlyErr ? "err" : errWarn ? "erraw" : null;
        document.querySelectorAll(".seg .preset").forEach((b) => b.classList.toggle("active", b.dataset.lv === mode));
      }

      async function exportCsv() {
        // 导出不受前端分页影响：单独拉取全量匹配行（limit=0），保证 CSV 完整。
        const payload = buildPayload();
        payload.limit = 0;
        payload.offset = 0;
        let rows;
        try {
          const data = await api("/api/query", payload);
          rows = data.rows || [];
        } catch (e) {
          $("statusText").textContent = "导出失败: " + e.message;
          return;
        }
        if (!rows.length) return;
        const cols = ["timestamp", "level", "context", "operator", "url", "requestId", "ip", "message", "requestBodySize", "responseBodySize"];
        const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
        const lines = [cols.join(",")];
        for (const r of rows) lines.push(cols.map((c) => esc(r[c])).join(","));
        const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `logs-${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      $("runBtn").addEventListener("click", () => { stopFollow(); doQuery(false); });
      $("resetBtn").addEventListener("click", () => {
        stopFollow();
        $("q").value = ""; $("from").value = ""; $("to").value = "";
        $("ridFilter").value = "";
        ctxMS.clear(); opMS.clear();
        $("order").value = "desc"; $("limit").value = "";
        renderLevels([]);
        doQuery(false);
      });
      $("exportBtn").addEventListener("click", exportCsv);
      $("followBtn").addEventListener("click", () => {
        if (followTimer) { stopFollow(); return; }
        $("followBtn").classList.add("on");
        $("followBtn").textContent = "停止跟随";
        $("liveDot").classList.add("on");
        doQuery(false);
        followTimer = setInterval(() => doQuery(true), 2000);
      });
      $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { stopFollow(); doQuery(false); } });
      document.querySelectorAll(".preset[data-p]").forEach((p) => p.addEventListener("click", () => setPreset(p.dataset.p)));
      document.querySelectorAll(".preset[data-lv]").forEach((p) =>
        p.addEventListener("click", () => { applyLevelPreset(p.dataset.lv); stopFollow(); doQuery(false); })
      );
      $("advToggle").addEventListener("click", () => {
        const collapsed = $("adv").classList.toggle("collapsed");
        $("advToggle").textContent = collapsed ? "高级筛选 ▾" : "高级筛选 ▴";
      });

      renderLevels([]);
      // 无限滚动：监听底部「加载更多」哨兵，进入视口（提前 300px）即加载下一页
      const sentinel = $("loadMore");
      if ("IntersectionObserver" in window && sentinel) {
        sentinelObs = new IntersectionObserver(
          (entries) => {
            for (const e of entries) if (e.isIntersecting) loadMore();
          },
          { root: null, rootMargin: "300px" },
        );
        sentinelObs.observe(sentinel);
      }
      loadList().then(() => doQuery(false));
    </script>
  </body>
</html>
