name: CI

# M8 工程化收尾（T18）：后端 install/build/单测 + 前端 install/build 的 CI 门禁。
# 触发：推送到 main 或向 main 提 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: 服务端 (typecheck + build + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 生成 Prisma Client
        # schema 含 AuditLog 等新模型，CI 必须重新生成 Client 才能通过类型检查与构建。
        run: npx prisma generate
      - name: 构建（nest build = tsc 类型检查 + 产物）
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-not-for-prod"
      - name: 单元测试（jest）
        # 现有单测均为纯函数/引擎级，不依赖运行中的数据库；env 仅作兜底。
        run: npm test
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-not-for-prod"

  client:
    name: 客户端 (vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建（vue-tsc 类型检查 + vite 打包）
        run: npm run build
